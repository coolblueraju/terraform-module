name: rerun-enforce-check-on-review
on:
  pull_request_review:
    types: [submitted, dismissed]
permissions: { actions: write, contents: read }
jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/enforce-workflow-codeowner.yml/runs?head_sha=$SHA&per_page=1" --jq '.workflow_runs[0].id // empty')
          [[ -z "$id" ]] || gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/$id/rerun"
